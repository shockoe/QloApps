services:
  qloapps:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qloapps-booking-system
    restart: unless-stopped
    environment:
      USER_PASSWORD: ${QLOAPPS_USER_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${QLOAPPS_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${QLOAPPS_DATABASE:-booking}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    ports:
      - "80:80"
    volumes:
      - qloapps_uploads:/home/qloapps/www/hotelcommerce/upload
      - qloapps_cache:/home/qloapps/www/hotelcommerce/cache
      - qloapps_config:/home/qloapps/www/hotelcommerce/config
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost', '||', 'exit', '1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Give services time to start

volumes:
  qloapps_uploads:
    external: true
  qloapps_cache:
    external: true
  qloapps_config:
    external: true
